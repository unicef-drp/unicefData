name: Weekly Metadata Refresh

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflow-config.yml'
      - '.github/scripts/load_workflow_config.py'
      - '.github/workflows/_reusable-metadata-refresh.yml'
      - '.github/workflows/metadata-sync.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  load-config:
    runs-on: ubuntu-22.04
    outputs:
      integration_branch: ${{ steps.workflow_config.outputs.integration_branch }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (workflow config loader)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Load workflow config
        id: workflow_config
        run: |
          python .github/scripts/load_workflow_config.py

  refresh-metadata:
    needs: load-config
    uses: ./.github/workflows/_reusable-metadata-refresh.yml
    with:
      integration_branch: ${{ needs.load-config.outputs.integration_branch }}
    secrets: inherit
