# Validate Metadata Schemas Workflow
# Validates YAML metadata files across Python, R, and Stata
#
# Pinned to ubuntu-22.04 for pandoc/citation tooling compatibility
# See: https://github.com/r-lib/actions/issues/994

name: Validate Metadata Schemas

on:
  push:
    branches: [main, develop]
    paths:
      - 'stata/src/_/*.yaml'
      - 'python/metadata/current/*.yaml'
      - 'metadata/current/*.yaml'
      - 'stata/src/py/validate_yaml_schema.py'
      - 'validation/scripts/validate_yaml_schema.py'
      - '.github/workflow-config.yml'
      - '.github/scripts/load_workflow_config.py'
      - '.github/workflows/_reusable-schema-validate.yml'
      - '.github/workflows/validate-schemas.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'stata/src/_/*.yaml'
      - 'python/metadata/current/*.yaml'
      - 'metadata/current/*.yaml'
      - 'stata/src/py/validate_yaml_schema.py'
      - 'validation/scripts/validate_yaml_schema.py'
      - '.github/workflow-config.yml'
      - '.github/scripts/load_workflow_config.py'
      - '.github/workflows/_reusable-schema-validate.yml'
      - '.github/workflows/validate-schemas.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-config:
    runs-on: ubuntu-22.04
    outputs:
      stata_validation_script: ${{ steps.workflow_config.outputs.stata_validation_script }}
      stata_metadata_dir: ${{ steps.workflow_config.outputs.stata_metadata_dir }}
      validation_script: ${{ steps.workflow_config.outputs.validation_script }}
      metadata_dir: ${{ steps.workflow_config.outputs.metadata_dir }}
      schema_strict: ${{ steps.workflow_config.outputs.schema_strict }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Load workflow config
        id: workflow_config
        run: |
          python .github/scripts/load_workflow_config.py

  validate-metadata:
    needs: load-config
    uses: ./.github/workflows/_reusable-schema-validate.yml
    with:
      stata_validation_script: ${{ needs.load-config.outputs.stata_validation_script }}
      stata_metadata_dir: ${{ needs.load-config.outputs.stata_metadata_dir }}
      validation_script: ${{ needs.load-config.outputs.validation_script }}
      metadata_dir: ${{ needs.load-config.outputs.metadata_dir }}
      schema_strict: ${{ needs.load-config.outputs.schema_strict }}
