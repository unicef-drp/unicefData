# Python Tests Workflow
# Runs pytest suite for the unicefdata Python package
# Cross-platform matrix: Ubuntu / macOS / Windows × Python 3.9–3.12

name: Python Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'tests/**'
      - '.github/workflow-config.yml'
      - '.github/scripts/load_workflow_config.py'
      - '.github/workflows/_reusable-python-tests.yml'
      - '.github/workflows/python-tests.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'tests/**'
      - '.github/workflow-config.yml'
      - '.github/scripts/load_workflow_config.py'
      - '.github/workflows/_reusable-python-tests.yml'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  load-config:
    runs-on: ubuntu-22.04
    outputs:
      py_pkg_dir: ${{ steps.workflow_config.outputs.py_pkg_dir }}
      require_cross_language_tests: ${{ steps.workflow_config.outputs.require_cross_language_tests }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Load workflow config
      id: workflow_config
      run: |
        python .github/scripts/load_workflow_config.py

  test:
    needs: load-config
    uses: ./.github/workflows/_reusable-python-tests.yml
    with:
      py_pkg_dir: ${{ needs.load-config.outputs.py_pkg_dir }}
      require_cross_language_tests: ${{ needs.load-config.outputs.require_cross_language_tests == 'true' }}
