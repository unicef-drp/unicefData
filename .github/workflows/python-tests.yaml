# Python Tests Workflow
# Runs pytest suite for the unicefdata Python package
# Cross-platform matrix: Ubuntu / macOS / Windows × Python 3.9–3.12

name: Python Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov responses
        cd python
        pip install -e .

    - name: Run Python unit tests
      run: |
        pytest python/tests/ --cov=unicefdata --cov-report=xml -v

    - name: Run cross-language fixture tests
      run: |
        pytest tests/test_cross_language_output.py -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: python
        name: python-${{ matrix.python-version }}-${{ matrix.os }}
        fail_ci_if_error: false
