name: Reusable R-CMD-check

on:
  workflow_call:
    inputs:
      r_pkg_dir:
        description: R package directory to check
        required: true
        type: string

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-22.04, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-22.04, r: 'release'}
          - {os: ubuntu-22.04, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (fixture preparation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare R test fixtures
        run: |
          python scripts/prepare_r_test_fixtures.py

      - name: Resolve R package directory
        id: resolve_r_pkg_dir
        shell: bash
        run: |
          set -e

          if [ -d "${{ inputs.r_pkg_dir }}" ]; then
            resolved="${{ inputs.r_pkg_dir }}"
          elif [ -d "r" ]; then
            resolved="r"
          elif [ -d "R" ]; then
            resolved="R"
          else
            echo "Could not find R package directory."
            echo "Checked: '${{ inputs.r_pkg_dir }}', 'r', 'R'."
            echo "Workspace contents:"
            ls -la
            exit 1
          fi

          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "Using R package directory: $resolved"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: ${{ steps.resolve_r_pkg_dir.outputs.resolved }}
          cache-version: 8
          upgrade: 'TRUE'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: ${{ steps.resolve_r_pkg_dir.outputs.resolved }}
          build_args: 'c("--no-manual")'
          error-on: '"error"'
