name: Reusable Metadata Schema Validation

on:
  workflow_call:
    inputs:
      stata_validation_script:
        description: Path to Stata-oriented schema validation script
        required: true
        type: string
      stata_metadata_dir:
        description: Directory containing Stata metadata YAML files
        required: true
        type: string
      validation_script:
        description: Path to cross-platform validation script
        required: true
        type: string
      metadata_dir:
        description: Metadata directory for cross-platform validation
        required: true
        type: string
      schema_strict:
        description: Whether optional schema domains should fail the workflow
        required: false
        default: 'true'
        type: string

jobs:
  validate-metadata:
    name: Validate YAML Metadata Files
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate Indicator Metadata
        id: validate-indicators
        run: |
          echo "::group::Validating Indicator Metadata"
          python "${{ inputs.stata_validation_script }}" indicators "${{ inputs.stata_metadata_dir }}/_unicefdata_indicators_metadata.yaml"
          echo "::endgroup::"

      - name: Validate Dataflow Index
        id: validate-dataflow-index
        run: |
          echo "::group::Validating Dataflow Index"
          python "${{ inputs.stata_validation_script }}" dataflow_index "${{ inputs.stata_metadata_dir }}/_dataflow_index.yaml"
          echo "::endgroup::"

      - name: Validate Dataflows Metadata
        id: validate-dataflows
        continue-on-error: true
        run: |
          echo "::group::Validating Dataflows Metadata"
          python "${{ inputs.stata_validation_script }}" dataflows "${{ inputs.stata_metadata_dir }}/_unicefdata_dataflows.yaml"
          echo "::endgroup::"

      - name: Validate Codelists
        id: validate-codelists
        continue-on-error: true
        run: |
          echo "::group::Validating Codelists"
          python "${{ inputs.stata_validation_script }}" codelists "${{ inputs.stata_metadata_dir }}/_unicefdata_codelists.yaml"
          echo "::endgroup::"

      - name: Validate Countries
        id: validate-countries
        continue-on-error: true
        run: |
          echo "::group::Validating Countries"
          python "${{ inputs.stata_validation_script }}" countries "${{ inputs.stata_metadata_dir }}/_unicefdata_countries.yaml"
          echo "::endgroup::"

      - name: Validate Regions
        id: validate-regions
        continue-on-error: true
        run: |
          echo "::group::Validating Regions"
          python "${{ inputs.stata_validation_script }}" regions "${{ inputs.stata_metadata_dir }}/_unicefdata_regions.yaml"
          echo "::endgroup::"

      - name: Cross-Platform Schema Validation
        id: validate-cross-platform
        run: |
          echo "::group::Cross-Platform Schema Validation"
          python "${{ inputs.validation_script }}" --strict \
            --python-dir "${{ inputs.metadata_dir }}" \
            --r-dir "${{ inputs.metadata_dir }}"
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          echo "## Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Indicators Metadata | ${{ steps.validate-indicators.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dataflow Index | ${{ steps.validate-dataflow-index.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dataflows Metadata | ${{ steps.validate-dataflows.outcome == 'success' && '✅ Pass' || '⚠️ Skip' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Codelists | ${{ steps.validate-codelists.outcome == 'success' && '✅ Pass' || '⚠️ Skip' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Countries | ${{ steps.validate-countries.outcome == 'success' && '✅ Pass' || '⚠️ Skip' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regions | ${{ steps.validate-regions.outcome == 'success' && '✅ Pass' || '⚠️ Skip' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cross-Platform Sync** | ${{ steps.validate-cross-platform.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Enforce strict schema policy
        if: always() && inputs.schema_strict == 'true'
        run: |
          failed=0

          if [ "${{ steps.validate-dataflows.outcome }}" = "failure" ]; then
            echo "Strict policy violation: dataflows metadata validation failed."
            failed=1
          fi

          if [ "${{ steps.validate-codelists.outcome }}" = "failure" ]; then
            echo "Strict policy violation: codelists validation failed."
            failed=1
          fi

          if [ "${{ steps.validate-countries.outcome }}" = "failure" ]; then
            echo "Strict policy violation: countries validation failed."
            failed=1
          fi

          if [ "${{ steps.validate-regions.outcome }}" = "failure" ]; then
            echo "Strict policy violation: regions validation failed."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
