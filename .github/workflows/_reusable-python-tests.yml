name: Reusable Python Tests

on:
  workflow_call:
    inputs:
      py_pkg_dir:
        description: Python package directory to test
        required: true
        type: string
      require_cross_language_tests:
        description: Whether to run repo-level cross-language fixture tests
        required: false
        default: true
        type: boolean

permissions: read-all

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov responses
          cd "${{ inputs.py_pkg_dir }}"
          pip install -e .

      - name: Run Python unit tests
        run: |
          pytest "${{ inputs.py_pkg_dir }}/tests/" --cov=unicefdata --cov-report=xml -v

      - name: Run cross-language fixture tests
        if: ${{ inputs.require_cross_language_tests }}
        run: |
          pytest tests/test_cross_language_output.py -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}-${{ matrix.os }}
          fail_ci_if_error: false